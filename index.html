<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rolling Stones · Janniks Kugelbahn</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f3e9; color: #142d33; font: 16px system-ui, sans-serif; }
    main { max-width: 1280px; margin: auto; padding: clamp(12px, 3vw, 32px); }
    header, .actions, .edit, .storage { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    header { justify-content: space-between; margin-bottom: 16px; }
    h1 { font-size: clamp(24px, 4vw, 38px); letter-spacing: -.04em; margin: 0; }
    button { font: inherit; font-weight: 650; color: inherit; background: #fffdf6; border: 1px solid #c6d4ce; border-radius: 12px; min-height: 44px; padding: 8px 12px; cursor: pointer; touch-action: manipulation; }
    button:disabled { opacity: .44; cursor: default; }
    button:focus-visible, .cell:focus-visible { outline: 3px solid #e28137; outline-offset: 2px; }
    #play { background: #146454; color: white; border-color: #146454; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 14px; align-items: start; }
    .table { min-width: 0; overflow: hidden; background: #e2ede5; border-radius: 20px; border: 1px solid #c6d4ce; }
    #board, #view3d { width: 100%; height: clamp(320px, 66dvh, 720px); }
    #board { display: block; background: radial-gradient(ellipse at top, #f5faf0, #d8e8de); }
    #view3d { display: none; }
    #view3d.active { display: block; }
    #board.hidden { display: none; }
    .cell { cursor: pointer; touch-action: manipulation; }
    .cell > * { pointer-events: none; }
    .cell:hover polygon { stroke: #146454; }
    aside { background: #fffdf6; border: 1px solid #dedbcf; border-radius: 20px; padding: 12px; }
    #tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .tool { padding: 7px 3px; font-size: 12px; }
    .tool span { display: block; font-size: 24px; line-height: 1.2; }
    .tool[aria-pressed="true"] { background: #d2ebd9; border-color: #146454; }
    .edit { margin-top: 12px; }
    .edit button { flex: 1; white-space: nowrap; }
    #status { margin: 0; padding: 12px 16px; background: #fffdf6; min-height: 48px; }
    .storage { margin-top: 12px; }
    @media (max-width: 740px) {
      .workspace { grid-template-columns: minmax(0, 1fr); }
      aside { grid-row: 1; }
      #tools { grid-template-columns: repeat(4, 1fr); }
      #board, #view3d { height: clamp(285px, 54dvh, 510px); }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Janniks Kugelbahn</h1>
    <div class="actions">
      <button id="toggle3d" type="button" aria-pressed="false">◇ 3D</button>
      <button id="reset" type="button" aria-label="Kugel zurücksetzen">↩</button>
      <button id="play" type="button">▶ Kugel los!</button>
    </div>
  </header>
  <div class="workspace">
    <section class="table" aria-label="Spielfeld">
      <svg id="board" viewBox="8 14 628 558" aria-label="Baufläche für die Kugelbahn"></svg>
      <div id="view3d" aria-label="Drehbare dreidimensionale Kugelbahn"></div>
      <p id="status" role="status">Drück auf ▶, um die Beispielbahn auszuprobieren.</p>
    </section>
    <aside aria-label="Bauteile und Werkzeuge">
      <div id="tools"></div>
      <div class="edit">
        <button id="rotate" type="button" aria-label="Bauteil drehen" title="Drehen">↻</button>
        <button id="lower" type="button" aria-label="Bauteil absenken">− Höhe</button>
        <button id="raise" type="button" aria-label="Bauteil anheben">+ Höhe</button>
        <button id="undo" type="button" aria-label="Rückgängig" title="Rückgängig">↶</button>
      </div>
    </aside>
  </div>
  <div class="storage">
    <button id="save" type="button">Speichern</button>
    <button id="load" type="button">Laden</button>
    <button id="clear" type="button">Beispielbahn</button>
    <button id="empty" type="button">Neue Bahn</button>
  </div>
</main>
<script type="module" src="./editor.mjs"></script>
</body>
</html>
