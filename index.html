<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rolling-Stones</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#e9f2fb;color:#19334f}header{background:#153f70;color:white;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}h1{font-size:25px;margin:0}button{border:0;border-radius:12px;background:white;padding:11px 14px;font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4}.toolbar{display:flex;flex-wrap:wrap;gap:7px;padding:10px;background:#d8e7f5;align-items:center}.tool{background:white;border:3px solid transparent;min-width:70px}.tool.active{border-color:#2078d5;background:#fff3c9}#board{display:block;width:100%;height:calc(100dvh - 185px);min-height:340px;touch-action:none;background:radial-gradient(circle at 50% 30%,#fff,#d5e7f5)}#status{font-weight:650;padding:8px 12px;background:#fff;min-height:38px}.primary{background:#1d8b5e;color:white}.danger{background:#f6dce1}#legend{font-size:12px;opacity:.75;padding:4px 12px}
</style>
<header><h1>🔵 Rolling-Stones</h1><span>Janniks Kugelbahn · Version 0.1</span></header>
<div class="toolbar" id="tools"></div>
<div class="toolbar"><button id="rotate">↻ Drehen</button><button id="play" class="primary">▶ Kugel los!</button><button id="reset">↩ Zurück</button><button id="undo">↶ Rückgängig</button><button id="save">💾 Speichern</button><button id="load">📂 Laden</button><button id="clear" class="danger">🧹 Neu</button></div>
<div id="status" aria-live="polite">Tippe auf ein Sechseck, um deine Bahn zu bauen.</div>
<svg id="board" role="img" aria-label="Interaktives sechseckiges Kugelbahn-Spielfeld"></svg>
<div id="legend">Blau = Bahn · Orange = Start · Grün = Ziel · Zahlen = Höhe. Erst Bauteil wählen, dann auf das Feld tippen. Ein gesetztes Bauteil lässt sich durch erneutes Tippen drehen.</div>
<script>
(()=>{'use strict';
const svg=document.querySelector('#board'), status=document.querySelector('#status'), tools=document.querySelector('#tools');
const NS='http://www.w3.org/2000/svg',R=36,H=Math.sqrt(3)*R,DX=1.5*R,DY=H, cols=11,rows=8;
const types=[['straight','━ Gerade'],['curve120','◔ Kurve 120°'],['curve60','↶ Kurve 60°'],['down','↘ Gefälle'],['up','↗ Steigung'],['support','▣ Stütze'],['end','🏁 Ziel'],['erase','✖ Entfernen']];
let selected='straight',rotation=0,tiles=new Map(),history=[],ball=null,raf=0,playing=false;
const key=(x,y)=>x+','+y, valid=(x,y)=>x>=0&&x<cols&&y>=0&&y<rows;
const center=(x,y)=>({x:52+x*DX,y:55+y*DY+(x%2)*DY/2});
const vertex=(c,i)=>({x:c.x+R*Math.cos(Math.PI/3*i),y:c.y+R*Math.sin(Math.PI/3*i)});
const side=(c,i)=>{let a=vertex(c,i),b=vertex(c,(i+1)%6);return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};
const neighbors=[[1,1],[0,2],[-1,1],[-1,-1],[0,-2],[1,-1]];
// Side indices 0..5 clockwise in screen coordinates; neighbor mapping by actual geometry.
function neighbor(x,y,s){let c=center(x,y),p=side(c,s),best=null,d=Infinity;for(let xx=x-1;xx<=x+1;xx++)for(let yy=y-2;yy<=y+2;yy++){if(!valid(xx,yy)||(xx===x&&yy===y))continue;let cc=center(xx,yy),dd=Math.hypot(cc.x-p.x,cc.y-p.y);if(dd<d){d=dd;best={x:xx,y:yy}}}return d<R*.6?best:null}
function ports(t){let a=t.rot%6;return t.type==='curve120'?[a,(a+2)%6]:t.type==='curve60'?[a,(a+1)%6]:[a,(a+3)%6]}
function shape(tag,attrs,parent=svg){let e=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs||{}))e.setAttribute(k,v);parent.append(e);return e}
function message(t){status.textContent=t}
function snapshot(){history.push(JSON.stringify([...tiles]));if(history.length>60)history.shift()}
function init(){tiles.clear();tiles.set(key(1,3),{type:'down',rot:0,z:2,locked:true});tiles.set(key(8,3),{type:'end',rot:0,z:0});}
function draw(){svg.setAttribute('viewBox','0 0 620 620');svg.innerHTML='';for(let x=0;x<cols;x++)for(let y=0;y<rows;y++){let c=center(x,y),t=tiles.get(key(x,y)),g=shape('g',{'data-x':x,'data-y':y});let pts=Array.from({length:6},(_,i)=>vertex(c,i)).map(p=>p.x+','+p.y).join(' ');shape('polygon',{points:pts,fill:t?(t.type==='end'?'#c2f0cd':t.type==='down'?'#ffe4a6':t.type==='support'?'#c5c5c5':'#fff0ce'):'#f5f9fd',stroke:'#91a9be','stroke-width':1.5},g);if(t){if(t.type==='support'){shape('text',{x:c.x,y:c.y+6,'text-anchor':'middle','font-size':23,fill:'#566'},g).textContent='▣'}else{let [a,b]=ports(t),p=side(c,a),q=side(c,b);let d=t.type==='curve120'||t.type==='curve60'? 'M'+p.x+' '+p.y+' Q'+c.x+' '+c.y+' '+q.x+' '+q.y:'M'+p.x+' '+p.y+' L'+q.x+' '+q.y;shape('path',{d,fill:'none',stroke:t.type==='end'?'#1e965a':'#257ad1','stroke-width':10,'stroke-linecap':'round'},g);shape('path',{d,fill:'none',stroke:'#9ed8ff','stroke-width':3,'stroke-linecap':'round'},g);if(t.type==='down'||t.type==='up')shape('text',{x:c.x,y:c.y+5,'text-anchor':'middle','font-size':19,fill:'#173e70','font-weight':'bold'},g).textContent=t.type==='down'?'−':'+';if(t.type==='end')shape('text',{x:c.x,y:c.y-12,'text-anchor':'middle','font-size':14},g).textContent='🏁'}shape('text',{x:c.x+14,y:c.y+23,'font-size':11,fill:'#243d56'},g).textContent='z'+t.z}if(t?.locked)shape('text',{x:c.x-7,y:c.y-12,'font-size':16},g).textContent='🔵';g.addEventListener('pointerdown',()=>place(x,y))}if(ball)shape('circle',{cx:ball.x,cy:ball.y,r:9,fill:'#2463df',stroke:'white','stroke-width':2});}
function place(x,y){if(playing)return;let k=key(x,y),old=tiles.get(k);if(old?.locked){message('Das Startstück bleibt an seinem Platz.');return}snapshot();if(selected==='erase'){tiles.delete(k)}else if(old&&old.type===selected){old.rot=(old.rot+1)%6}else{tiles.set(k,{type:selected,rot:rotation,z:old?.z||0})}draw()}
function nextFrom(x,y,entry){let t=tiles.get(key(x,y));if(!t||t.type==='support')return null;let p=ports(t),exit=entry===null?p[0]:p[0]===entry?p[1]:p[1]===entry?p[0]:null;if(exit===null)return null;let n=neighbor(x,y,exit);if(!n)return null;let nt=tiles.get(key(n.x,n.y));if(!nt||nt.type==='support')return{missing:true};let targetSide=(exit+3)%6;if(!ports(nt).includes(targetSide))return{missing:true};let outZ=t.z+(t.type==='down'?-1:t.type==='up'?1:0);if(outZ!==nt.z)return{height:true};return{x:n.x,y:n.y,entry:targetSide,exit,from:t}}
function run(){if(playing)return;let start=tiles.get(key(1,3));if(!start){message('Startstück fehlt.');return}let x=1,y=3,entry=null,speed=0.1,route=[],visited=new Set(),fail='';for(let i=0;i<100;i++){let t=tiles.get(key(x,y));if(!t){fail='Hier fehlt ein Bauteil.';break}if(t.type==='end'){fail='🎉 Geschafft! Die Kugel ist im Ziel!';break}let id=x+','+y+','+entry;if(visited.has(id)){fail='Die Kugel fährt im Kreis.';break}visited.add(id);let n=nextFrom(x,y,entry);if(!n||n.missing){fail='Die Bahn endet oder die Anschlüsse passen nicht.';break}if(n.height){fail='Die Höhen der Schienen passen nicht zusammen.';break}let p=ports(t),exit=n.exit,a=side(center(x,y),entry===null?p[1]:entry),b=side(center(x,y),exit);if(entry===null)a=center(x,y);let length=Math.hypot(b.x-a.x,b.y-a.y);let loss=t.type==='curve60'?.24:t.type==='curve120'?.13:.045;speed=Math.sqrt(Math.max(0,speed*speed+(t.type==='down'?1.5:t.type==='up'?-1.5:0)-loss));if(speed<.12){fail='Die Kugel bleibt stehen. Versuche mehr Gefälle!';break}route.push({a,b,length,speed});x=n.x;y=n.y;entry=n.entry}
if(!route.length){message(fail||'Keine Verbindung.');return}playing=true;let total=route.reduce((s,p)=>s+p.length/Math.max(.3,p.speed),0),elapsed=0,last=0;function tick(time){if(!last)last=time;elapsed+=(time-last)/1000*55;last=time;let rem=elapsed;for(let seg of route){let duration=seg.length/Math.max(.3,seg.speed);if(rem<=duration){let f=rem/duration;ball={x:seg.a.x+(seg.b.x-seg.a.x)*f,y:seg.a.y+(seg.b.y-seg.a.y)*f};draw();raf=requestAnimationFrame(tick);return}rem-=duration}playing=false;ball=null;draw();message(fail||'Die Kugel ist angekommen.')}message('🔵 Die Kugel rollt …');raf=requestAnimationFrame(tick)}
function stop(){cancelAnimationFrame(raf);playing=false;ball=null;draw()}
types.forEach(([id,label])=>{let b=document.createElement('button');b.className='tool';b.textContent=label;b.dataset.type=id;b.onclick=()=>{selected=id;document.querySelectorAll('.tool').forEach(e=>e.classList.toggle('active',e.dataset.type===id));message('Ausgewählt: '+label)};tools.append(b)});document.querySelector('.tool').classList.add('active');
document.querySelector('#rotate').onclick=()=>{rotation=(rotation+1)%6;message('Ausrichtung: '+rotation*60+'°')};document.querySelector('#play').onclick=run;document.querySelector('#reset').onclick=()=>{stop();message('Bereit für den nächsten Versuch.')};document.querySelector('#undo').onclick=()=>{if(history.length){stop();tiles=new Map(JSON.parse(history.pop()));draw()}};document.querySelector('#save').onclick=()=>{localStorage.setItem('rolling-stones-v1',JSON.stringify([...tiles]));message('💾 Bahn gespeichert!')};document.querySelector('#load').onclick=()=>{let s=localStorage.getItem('rolling-stones-v1');if(s){stop();tiles=new Map(JSON.parse(s));draw();message('📂 Bahn geladen!')}else message('Noch keine gespeicherte Bahn.')};document.querySelector('#clear').onclick=()=>{stop();snapshot();init();draw();message('Neue Bahn!')};init();draw();
})();
</script></html>
